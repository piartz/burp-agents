# Generated by scripts/sync-agents.py. Run from the repository root.
# Requires a local engagement.toml copied from config/engagement.example.toml.
# Profile: active; choose the other template to change capabilities.
[mcp_servers.burp]
command = "python3"
args = ["scripts/burp-gateway.py", "--engagement", "engagement.toml", "--profile", "active"]
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = ["get_proxy_http_history", "get_proxy_http_history_regex", "get_scanner_issues", "get_organizer_items", "get_organizer_items_regex", "get_proxy_websocket_history", "get_proxy_websocket_history_regex", "send_http1_request", "send_http2_request", "create_repeater_tab", "create_repeater_tab_http2", "generate_collaborator_payload", "get_collaborator_interactions"]
